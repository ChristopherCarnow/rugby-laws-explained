<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9814519382716743"
     crossorigin="anonymous"></script>
     
     <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1KHKZLFPLF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-1KHKZLFPLF');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Rugby Laws Explained{% endblock %}</title>
    <meta
      name="description"
      content="{% block description %}Plain-English explanations of every law in rugby, written for South African fans.{% endblock %}"
    />
    <link rel="canonical" href="https://rugbylaws.co.za{{ request.path }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

        <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">

    <!-- Social share preview (WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="{% block og_title %}Rugby Laws Explained{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Rugby's laws explained in plain English, for South African fans.{% endblock %}">
    <meta property="og:image" content="https://rugbylaws.co.za{{ url_for('static', filename='images/social-share.png') }}">
    <meta property="og:url" content="https://rugbylaws.co.za{{ request.path }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <a href="#top" class="back-to-top" aria-label="Back to top">&uarr;</a>
  <body>
    <span id="top"></span>
    <header>
      <div class="header-inner">
        <h1><a href="/">Rugby Laws Explained</a></h1>
        <nav>
          <a href="/">Home</a>
          <a href="/laws">Laws</a>
          <a href="/glossary">Glossary</a>
          <a href="/explainers">Explainers</a>
        </nav>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>Independently written. Not affiliated with World Rugby.</p>
      <p>&copy; {{ current_year }} Forester Web Studio. All rights reserved.</p>
    </footer>
  </body>
</html>
